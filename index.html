<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chirag Quiz Game</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:15px;min-height:100vh;
 background:linear-gradient(135deg,#080b2c,#5013a0,#111b50);
 color:white;font-family:Arial,sans-serif
}
.container{max-width:600px;margin:auto}
h1{text-align:center;color:#ffd700}
.card{
 background:#ffffff16;border:1px solid #ffffff30;
 border-radius:18px;padding:18px;margin:14px 0
}
input,button{width:100%;padding:14px;border:0;border-radius:10px;font-size:16px;margin:7px 0}
button{background:linear-gradient(90deg,#ffd700,#ffae00);color:#241344;font-weight:bold;cursor:pointer}
.option{background:#ffffff20;color:white;border:1px solid #ffffff55;text-align:left}
.option.correct{background:#168b43}
.option.wrong{background:#bd3030}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat{background:#ffffff18;border-radius:10px;padding:12px 3px}
.stat b{display:block;color:#ffd700;font-size:20px;margin-top:5px}
.small{text-align:center;color:#ddd;font-size:13px}
#quizArea{display:none}
#timer{text-align:center;color:#ffd700;font-size:28px;font-weight:bold}
#question{font-size:21px;line-height:1.5}
#message{text-align:center;min-height:25px;font-weight:bold}
#leaderboard div{padding:9px;border-bottom:1px solid #ffffff25;display:flex;justify-content:space-between}
footer{text-align:center;color:#ccc;font-size:12px;margin:20px}
</style>
</head>
<body>
<div class="container">
<h1>🏆 Chirag Quiz Game</h1>
<p class="small">खेलो • सीखो • अपना स्कोर बढ़ाओ</p>

<div class="card" id="loginArea">
<h2>👤 खिलाड़ी का नाम</h2>
<input id="playerName" maxlength="20" placeholder="अपना नाम लिखें">
<button onclick="startGame()">गेम शुरू करें</button>
</div>

<div id="quizArea">
<div class="card">
<div class="stats">
<div class="stat">इस गेम का स्कोर<b id="score">0</b></div>
<div class="stat">कुल पॉइंट<b id="points">0</b></div>
<div class="stat">हाई स्कोर<b id="best">0</b></div>
</div>
</div>

<div class="card">
<p class="small" id="category">सामान्य ज्ञान</p>
<div id="timer">20</div>
<p class="small">सेकंड बाकी</p>
<h2 id="question">सवाल</h2>
<div id="options"></div>
<p id="message"></p>
<p class="small">सवाल नंबर: <span id="count">1</span></p>
</div>

<button id="nextBtn" onclick="nextQuestion()" style="display:none">अगला सवाल →</button>
<button onclick="backHome()" style="background:#ddd">गेम बंद करें</button>
</div>

<div class="card">
<h2>🏅 टॉप 10 खिलाड़ी</h2>
<div id="leaderboard"></div>
</div>
<footer>Chirag Quiz Game</footer>
</div>

<script>
const bank=[

["Science","मानव शरीर में रक्त कौन पंप करता है?",["फेफड़ा","हृदय","मस्तिष्क","गुर्दा"],1],
["Science","पानी का रासायनिक सूत्र क्या है?",["CO2","O2","H2O","NaCl"],2],
["Science","सूर्य के सबसे निकट ग्रह कौन सा है?",["पृथ्वी","बुध","मंगल","शनि"],1],
["Science","मनुष्य सांस लेने में कौन सी गैस उपयोग करता है?",["ऑक्सीजन","नाइट्रोजन","हाइड्रोजन","हीलियम"],0],
["Science","पृथ्वी का प्राकृतिक उपग्रह कौन है?",["सूर्य","चंद्रमा","मंगल","शुक्र"],1],
["Science","बल की SI इकाई क्या है?",["जूल","वाट","न्यूटन","मीटर"],2],
["Science","पानी सामान्यतः कितने डिग्री पर उबलता है?",["50","100","150","200"],1],
["Science","मानव शरीर का सबसे बड़ा अंग कौन सा है?",["हृदय","त्वचा","फेफड़ा","यकृत"],1],
["Science","ध्वनि किसमें यात्रा नहीं कर सकती?",["हवा","पानी","निर्वात","लोहा"],2],
["Maths","12 + 15 कितना है?",["25","27","29","30"],1],
["Maths","9 × 8 कितना है?",["64","72","81","78"],1],
["Maths","100 का आधा कितना है?",["25","40","50","60"],2],
["Maths","त्रिभुज में कितनी भुजाएँ होती हैं?",["2","3","4","5"],1],
["Maths","15 का वर्ग कितना है?",["125","200","225","250"],2],
["Maths","एक दर्जन में कितनी वस्तुएँ होती हैं?",["10","12","15","20"],1],
["Maths","200 का 25 प्रतिशत कितना है?",["25","40","50","75"],2],
["Maths","7 × 7 कितना है?",["42","48","49","56"],2],
["Geography","भारत की राजधानी क्या है?",["मुंबई","नई दिल्ली","जयपुर","लखनऊ"],1],
["Geography","विश्व का सबसे बड़ा महासागर कौन सा है?",["हिंद","अटलांटिक","प्रशांत","आर्कटिक"],2],
["Geography","भारत में कितने राज्य हैं?",["26","27","28","29"],2],
["Geography","गंगा नदी का उद्गम किस हिमनद से होता है?",["सियाचिन","गंगोत्री","पिंडारी","जेमू"],1],
["Geography","विश्व का सबसे ऊँचा पर्वत कौन सा है?",["K2","कंचनजंगा","एवरेस्ट","नंदा देवी"],2],
["Geography","राजस्थान की राजधानी क्या है?",["जोधपुर","जयपुर","उदयपुर","अजमेर"],1],
["History","भारत स्वतंत्र कब हुआ?",["1945","1947","1950","1952"],1],
["History","भारत के राष्ट्रपिता किसे कहा जाता है?",["नेहरू","गांधी","सुभाष बोस","भगत सिंह"],1],
["History","ताजमहल किसने बनवाया?",["अकबर","शाहजहाँ","बाबर","औरंगजेब"],1],
["History","भारत का संविधान कब लागू हुआ?",["1947","1950","1952","1949"],1],
["History","झाँसी की रानी का नाम क्या था?",["दुर्गावती","लक्ष्मीबाई","अहिल्याबाई","पद्मिनी"],1],
["History","भारत छोड़ो आंदोलन किस वर्ष हुआ?",["1920","1930","1942","1947"],2],
["Computer","CPU का पूरा नाम क्या है?",["Central Processing Unit","Computer Power Unit","Central Program Utility","Control User"],0],
["Computer","कंप्यूटर का दिमाग किसे कहते हैं?",["माउस","कीबोर्ड","CPU","मॉनिटर"],2],
["Computer","WWW का पूरा नाम क्या है?",["World Wide Web","World Web Window","Wide World Work","Web World"],0],
["Computer","टाइप करने के लिए क्या उपयोग होता है?",["माउस","कीबोर्ड","स्पीकर","प्रिंटर"],1],
["Computer","कौन सा उपकरण आउटपुट देता है?",["कीबोर्ड","माउस","मॉनिटर","स्कैनर"],2],
["Sports","क्रिकेट में एक टीम में कितने खिलाड़ी होते हैं?",["9","10","11","12"],2],
["Sports","ओलंपिक खेल सामान्यतः कितने साल में होते हैं?",["2","3","4","5"],2],
["Sports","फुटबॉल टीम में मैदान पर कितने खिलाड़ी होते हैं?",["9","10","11","12"],2],
["Sports","हॉकी में गेंद मारने के लिए क्या उपयोग होता है?",["बैट","स्टिक","रैकेट","डंडा"],1],
["Sports","शतरंज की बिसात में कितने खाने होते हैं?",["32","48","64","100"],2],
["Biology","मानव शरीर में कितने फेफड़े होते हैं?",["एक","दो","तीन","चार"],1],
["Biology","रक्त का लाल रंग किसके कारण होता है?",["क्लोरोफिल","हीमोग्लोबिन","प्लाज्मा","कैल्शियम"],1],
["Biology","पौधों का हरा रंग किसके कारण होता है?",["हीमोग्लोबिन","क्लोरोफिल","प्रोटीन","स्टार्च"],1],
["Biology","वयस्क मानव शरीर में सामान्यतः कितनी हड्डियाँ होती हैं?",["106","206","306","406"],1],
["GK","भारत का राष्ट्रीय पशु कौन है?",["शेर","बाघ","हाथी","हिरण"],1],
["GK","भारत का राष्ट्रीय पक्षी कौन है?",["तोता","कबूतर","मोर","हंस"],2],
["GK","भारत का राष्ट्रीय फूल कौन सा है?",["गुलाब","कमल","गेंदा","चमेली"],1],
["GK","भारत का राष्ट्रगान किसने लिखा?",["प्रेमचंद","रवींद्रनाथ टैगोर","गांधी","बंकिमचंद्र"],1],
["GK","एक सप्ताह में कितने दिन होते हैं?",["5","6","7","8"],2],
["GK","भारत की मुद्रा क्या है?",["डॉलर","रुपया","यूरो","येन"],1],
["GK","भारत का राष्ट्रीय वृक्ष कौन सा है?",["नीम","पीपल","बरगद","आम"],2],
["GK","सूर्य किस दिशा से निकलता है?",["पश्चिम","उत्तर","दक्षिण","पूर्व"],3],
["Entertainment","फिल्म देखने के लिए किसका उपयोग होता है?",["टीवी","फ्रिज","पंखा","मिक्सर"],0],
["GK","भारत का राष्ट्रीय फल कौन सा है?",["सेब","आम","केला","अंगूर"],1],
["Science","लाल ग्रह किसे कहा जाता है?",["शुक्र","मंगल","बुध","बृहस्पति"],1],
["Science","सौरमंडल का सबसे बड़ा ग्रह कौन है?",["पृथ्वी","मंगल","बृहस्पति","शनि"],2],
["Geography","उत्तर प्रदेश की राजधानी क्या है?",["कानपुर","लखनऊ","आगरा","वाराणसी"],1],
["Sports","बैडमिंटन किससे खेला जाता है?",["बैट","रैकेट","स्टिक","गेंद"],1]
];

let player="",data={},used=[],questions=[],current=0;
let score=0,timer=null,timeLeft=20,answered=false;

function loadData(){
 try{data=JSON.parse(localStorage.getItem("chiragQuizData"))||{}}
 catch(e){data={}}
}
function saveData(){
 localStorage.setItem("chiragQuizData",JSON.stringify(data));
}
function shuffle(arr){
 let a=[...arr];
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}
function startGame(){
 let name=document.getElementById("playerName").value.trim();
 if(!name){alert("पहले अपना नाम लिखें");return}
 player=name;
 loadData();
 if(!data[player])data[player]={points:0,best:0,used:[]};
 if(!Array.isArray(data[player].used))data[player].used=[];
 used=data[player].used;
 score=0;current=0;
 questions=shuffle(bank.map((q,i)=>i).filter(i=>!used.includes(i)));
 if(questions.length===0){
  used=[];data[player].used=[];saveData();
  questions=shuffle(bank.map((q,i)=>i));
 }
 document.getElementById("loginArea").style.display="none";
 document.getElementById("quizArea").style.display="block";
 updateStats();
 showQuestion();
}
function updateStats(){
 document.getElementById("score").textContent=score;
 document.getElementById("points").textContent=data[player].points;
 document.getElementById("best").textContent=data[player].best;
 updateLeaderboard();
}
function showQuestion(){
 if(current>=questions.length){
  used=[];data[player].used=[];saveData();
  questions=shuffle(bank.map((q,i)=>i));
  current=0;
 }
 answered=false;timeLeft=20;
 let q=bank[questions[current]];
 document.getElementById("category").textContent="विषय: "+q[0];
 document.getElementById("question").textContent=q[1];
 document.getElementById("count").textContent=current+1;
 document.getElementById("message").textContent="";
 document.getElementById("nextBtn").style.display="none";
 let box=document.getElementById("options");
 box.innerHTML="";
 q[2].forEach((option,i)=>{
  let b=document.createElement("button");
  b.className="option";
  b.textContent=(i+1)+". "+option;
  b.onclick=()=>answerQuestion(i);
  box.appendChild(b);
 });
 updateTimer();
 clearInterval(timer);
 timer=setInterval(()=>{
  timeLeft--;
  updateTimer();
  if(timeLeft<=0){
   clearInterval(timer);
   if(!answered){
    answered=true;
    document.getElementById("message").textContent="⏰ समय समाप्त!";
    lockOptions();
    document.getElementById("nextBtn").style.display="block";
   }
  }
 },1000);
}
function updateTimer(){
 document.getElementById("timer").textContent=timeLeft;
}
function lockOptions(){
 document.querySelectorAll(".option").forEach(b=>b.disabled=true);
}
function answerQuestion(choice){
 if(answered)return;
 answered=true;clearInterval(timer);
 let q=bank[questions[current]];
 lockOptions();
 let buttons=document.querySelectorAll(".option");
 buttons[q[3]].classList.add("correct");
 if(choice===q[3]){
  score+=10;
  data[player].points+=10;
  data[player].best=Math.max(data[player].best,score);
  document.getElementById("message").textContent="🎉 सही जवाब! +10 पॉइंट";
 }else{
  buttons[choice].classList.add("wrong");
  document.getElementById("message").textContent="❌ गलत जवाब!";
 }
 saveData();updateStats();
 document.getElementById("nextBtn").style.display="block";
}
function nextQuestion(){
 if(!answered)return;
 let id=questions[current];
 if(!used.includes(id))used.push(id);
 data[player].used=used;
 saveData();
 current++;
 showQuestion();
}
function updateLeaderboard(){
 let list=Object.entries(data).sort((a,b)=>b[1].points-a[1].points).slice(0,10);
 let html="";
 list.forEach((item,i)=>{
  html+="<div><span>"+(i+1)+". "+escapeHTML(item[0])+"</span><b>"+item[1].points+" ⭐</b></div>";
 });
 document.getElementById("leaderboard").innerHTML=html||"अभी कोई खिलाड़ी नहीं";
}
function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function backHome(){
 clearInterval(timer);
 document.getElementById("quizArea").style.display="none";
 document.getElementById("loginArea").style.display="block";
}
loadData();
updateLeaderboard();
</script>
</body>
</html>
